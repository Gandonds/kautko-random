<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault - Top Downloads</title>
    <link rel="stylesheet" href="all.css"> </head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <a href="main.html"><img src="gamevault.jpg" width="80" height="80"></a>
            </div>
            <div class="btn-group">
                <form action="main.html"><button class="glow-on-hover">Home</button></form>
                <form action="all.html"><button class="glow-on-hover">All games</button></form>
                <form action="trending.html"><button class="glow-on-hover">Trending</button></form>
                <form action="downloads.html"><button class="glow-on-hover">Top downloads</button></form>
            </div>
        </div>
        
        <div class="main-cont">
            <div class="content" style="display: flex; flex-direction: column; align-items: center;">
                
                <h1 style="color: white; margin-bottom: 20px; font-family: sans-serif;">Top Downloads</h1>
                
                <div class="game-box" id="downloads-grid">
                    <p style="color: white; padding: 20px;">Loading top downloads...</p>
                </div>

            </div>
        </div>
    </div>

    <script src="downloads.js"></script>
</body>
</html>
